[package]
name = "vpn-frame"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
tun-rs = {version = "=2.0.8", features = ["async"]}
#tun-rs = {git = "https://github.com/wugren/tun-rs.git", features = ["async"]}
pnet_packet = {version = "0.35.0"}
sfo-pool = "0.2.1"
async-trait = "0.1.85"
sfo-result = "0.2.4"
bucky-raw-codec = {version = "0.1", features = ["derive"]}
log = "0.4.25"
rand = "0.9.0"
sha2 = "0.10.8"
base58 = "0.2.0"
base36 = "0.0.1"
serde = "1.0.217"
sfo-cmd-server = { version = "0.3.2" }
callback-result = "0.2.2"
