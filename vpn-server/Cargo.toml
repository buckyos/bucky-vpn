[package]
name = "bucky-vpn-server"
version = "1.3.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
async-std = {version = "1.13.1", features = ["tokio1"]}
async-trait = "0.1.85"
bucky-raw-codec = {version = "0.1", features = ["derive"]}
p2p-frame = {git = "https://github.com/buckyos/bucky-p2p.git", features = ["x509"]}
sfo-account = { version = "0.1", features = ["login"]}
vpn-frame = { path = "../vpn-frame"}
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
sfo-log = "0.1.3"
clap = "4.5.31"
config = "0.15.8"
log = "0.4.26"
sfo-http = { version = "0.6.7", features = ["tide", "openapi"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["vendored"] }
sfo-result = "0.2.6"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.140"
base58 = "0.2.0"
dirs = "6.0.0"
if-addrs = "0.13.4"
rcgen = { version = "0.14", features = ["aws_lc_rs"] }
sfo-reuseport = "0.3.4"
