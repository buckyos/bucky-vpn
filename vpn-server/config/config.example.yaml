# BuckyVPN 服务端配置模板。
#
# 使用方式：
#   cp vpn-server/config/config.example.yaml config.yaml
#   bucky-vpn-server --config config.yaml
#
# VPN_ 前缀的环境变量可以覆盖配置项，例如：
# VPN_NAME、VPN_PN_TRANSPORT、VPN_SN_ADMIN_NAME、VPN_SN_ADMIN_PASSWORD、
# VPN_SN_JWT_KEY、VPN_DATA_DIR。

# 本机 P2P identity 证书名，也是作为 PN 代理节点上报给控制节点的名字。
# 修改该值后，服务端会保留已有私钥并重签生成带新名字的证书。
name: "bucky-vpn-server"

# SN 服务和内置 PN 代理节点使用的 P2P 监听地址。
# 服务端会在同一 IP/端口上同时监听 QUIC 和 TCP。
ip: "0.0.0.0"
port: 3624

# 本机 SN 控制服务和控制节点管理面。
sn:
  enabled: true

  # HTTP 管理 API 监听地址。
  # 如果前面有 nginx 或容器端口映射，这里保留进程内部端口即可。
  http:
    ip: "0.0.0.0"
    port: 3445

  # 管理员账号。启动时会把这里的密码写入该账号；账号不存在时会自动创建。
  admin:
    name: "admin"
    password: "change-me"

  # HTTP 登录会话使用的 JWT 签名密钥。部署时请替换为足够长的随机字符串。
  jwt:
    key: "change-me-to-a-long-random-secret"

# 本机 PN 代理服务。
pn:
  enabled: true

  # PN 传输模式：tcp 仅启用 TCP，quic 仅启用 QUIC，dual 同时启用两者。
  # 未配置时默认 dual，也可以通过 VPN_PN_TRANSPORT 覆盖。
  # tcp 和 quic 仅适用于独立 PN（sn.enabled: false）；同进程 SN+PN 必须使用 dual。
  # dual 模式同时监听并发布 QUIC/TCP，但连接控制节点时使用 QUIC。
  transport: "dual"

  # 流量统计批量上报间隔，不参与代理在线判定。
  report_interval_secs: 5
  # 独立心跳周期及控制面离线超时；timeout 必须大于 interval。
  heartbeat_interval_secs: 5
  heartbeat_timeout_secs: 15

  # 流量采样形成完整逻辑批次后立即唤醒上传器。以下限制只约束队列和传输，
  # 不限制一次采样最终可发送的记录总数。
  # 当前待发送批次驻留内存；优雅退出会在限定时间内排空，但进程崩溃不保证恢复。
  traffic_upload:
    records_per_command: 25000
    concurrent_commands: 4
    backlog_batches: 64
    retry_delay_ms: 250
    shutdown_drain_secs: 5

  # 可选：显式声明客户端可访问的外网 IP。配置后该地址具有最高优先级，
  # 程序不再探测本机出口地址，控制节点也不会用连接观测 IP 覆盖它。
  # advertised_ip: "203.0.113.20"

  # 未配置 advertised_ip 时，是否尝试上报本机监听/出口地址。默认 true。
  # 关闭后，独立代理节点由控制面使用连接观测 IP；同机代理若无可用地址则不会下发。
  report_local_address: true

  # 可选：配置进程监听端口对外映射后的端口。端口映射与 advertised_ip 独立：
  # 配置某协议时使用映射端口，未配置时保留该协议的监听端口；只发布
  # pn.transport 已启用协议的映射，tcp/quic 单协议模式会忽略另一协议的映射。
  # port_mapping:
  #   quic: 3624
  #   tcp: 3624

  # 纯代理节点部署时，将 sn.enabled 设为 false、pn.enabled 设为 true，
  # 然后取消下面注释并填入控制节点的身份 ID 和 endpoint。
  # control_server:
  #   id: "control-server-node-id"
  #   name: "control-server-name"
  #   endpoint: "203.0.113.10:3624"

# identity、SQLite 数据库和日志使用的数据目录。
data:
  dir: "./data/bucky-vpn-server"

log: true
log.level: "info"
