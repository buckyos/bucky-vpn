schema_version: 1
version: v0.1
module: repo-governance
defaults:
  workdir: .
  timeout_sec: 300
  env: {}
levels:
  unit:
    mode: enabled
    summary: 必需的 harness 初始化文件存在
    test_targets:
      - AGENTS.md
      - docs/
      - harness/
    preconditions:
      tools:
        - python3
      env: []
      services: []
      notes:
        - 不需要网络，也不依赖产品运行时
    steps:
      - id: repo-governance-unit
        name: 校验治理相关必需文件存在
        run: ["python3", "./harness/scripts/test-run.py", "repo-governance", "unit"]
  dv:
    mode: enabled
    summary: 代表性模块 packet 的元数据和 testplan 结构有效
    test_targets:
      - docs/versions/v0.1/modules/repo-governance/
      - harness/rules/
      - harness/human-rules/
    preconditions:
      tools:
        - python3
      env: []
      services: []
      notes: []
    steps:
      - id: repo-governance-dv
        name: 校验代表性 packet 元数据
        run: ["python3", "./harness/scripts/test-run.py", "repo-governance", "dv"]
  integration:
    mode: enabled
    summary: AGENTS、docs 和 harness 的引用保持一致
    test_targets:
      - AGENTS.md
      - docs/modules/
      - docs/architecture/
      - harness/rules/
      - harness/human-rules/
      - harness/process_rules/
    preconditions:
      tools:
        - python3
      env: []
      services: []
      notes: []
    steps:
      - id: repo-governance-integration
        name: 校验交叉引用与模块覆盖
        run: ["python3", "./harness/scripts/test-run.py", "repo-governance", "integration"]
