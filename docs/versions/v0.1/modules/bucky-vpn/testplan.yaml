schema_version: 1
version: v0.1
module: bucky-vpn
defaults:
  workdir: .
  timeout_sec: 1800
  env: {}
levels:
  unit:
    mode: enabled
    summary: 运行客户端 crate 测试
    test_targets:
      - vpn-client
    preconditions:
      tools:
        - cargo
      env: []
      services: []
      notes:
        - 当前仓库的 crate 级测试覆盖可能较少
        - 本轮 PN proxy 上报名通过共享 `PnServerInfo::remote_name` 单元覆盖和客户端连接目标编译覆盖
    steps:
      - id: bucky-vpn-unit
        name: 运行 bucky-vpn crate 测试
        change_ids: ["CHG-client-pn-proxy-route-resolver", "CHG-client-configurable-local-api-address", "CHG-client-node-id-base36", "CHG-client-sn-quic-tcp-priority", "CHG-client-join-server-name-for-sn", "CHG-client-pn-proxy-reported-name"]
        run: ["python3", "./harness/scripts/test-run.py", "bucky-vpn", "unit"]
  dv:
    mode: enabled
    summary: 构建客户端二进制 crate
    test_targets:
      - vpn-client
    preconditions:
      tools:
        - cargo
      env: []
      services: []
      notes: []
    steps:
      - id: bucky-vpn-dv
        name: 构建 bucky-vpn crate
        change_ids: ["CHG-client-pn-proxy-route-resolver", "CHG-client-configurable-local-api-address", "CHG-client-node-id-base36", "CHG-client-sn-quic-tcp-priority", "CHG-client-join-server-name-for-sn", "CHG-client-pn-proxy-reported-name"]
        run: ["python3", "./harness/scripts/test-run.py", "bucky-vpn", "dv"]
  integration:
    mode: enabled
    summary: 拉起 vpn-client/vpn-server 进程验证 PN proxy 多拓扑成员接入、1 CPU control/proxy 节点、proxy 审批、刷新、客户端虚拟网段通信和流量上报
    test_targets:
      - vpn-client
      - vpn-frame
      - vpn-server
    preconditions:
      tools:
        - cargo
        - multipass
      env: []
      services: []
      notes:
        - 脚本会为每个 vpn-client / vpn-server 节点创建独立 Multipass 实例并在实例内启动真实进程
        - 默认会自动准备/复用停止状态的基础实例，并从该实例 clone 测试节点；如需回退到逐节点 launch，可传 `--no-use-base-image` 或设置 `BUCKY_VPN_INTEGRATION_USE_BASE_IMAGE=0`
        - `--parallel-instances <n>` 控制每个场景内并发创建 VM 的数量，默认保守并发 2 路；统一入口默认显式使用 2 路，可用 `BUCKY_VPN_INTEGRATION_PARALLEL_INSTANCES=<n>` 或直接调用脚本覆盖
        - 集成脚本包含 control 节点和 proxy 节点均限制为 1 CPU 的 split control/proxy 场景，覆盖低 CPU 节点启动、审批、刷新和数据面通信
        - 脚本会阻断并验证 client 实例底层 IP 之间不可直连，避免虚拟网段通信误走底层直连
        - 每个 client daemon 在自己的实例内使用默认 VPN_API_PORT，本机通过实例 IPv4 访问本地 API
        - 脚本会批准远端 PN proxy nodes、批准 joined nodes、分配网络成员虚拟 IP，并在同一 client 实例内重启 daemon 验证 joined_networks 恢复、成员注册和 TUN runtime readiness
        - 脚本会在 TUN ready 后阻断非 PN control server 路径，并对每个共享网络的 client 虚拟 IP 做双向 ping
        - ping 流量产生后，脚本会轮询 control API，确认 `/get_network_member` 和 `/get_user_traffic_stats` 返回非零流量统计
        - PN proxy 上报名的完整 live 证书验证依赖 p2p-frame 行为，本入口主要拦截跨 crate 协议/DTO 漂移
    steps:
      - id: bucky-vpn-integration
        name: 运行 PN proxy 多拓扑、1 CPU control/proxy 和流量上报进程集成测试
        change_ids: ["CHG-client-pn-proxy-route-resolver", "CHG-client-configurable-local-api-address", "CHG-client-node-id-base36", "CHG-client-pn-proxy-reported-name"]
        run: ["python3", "./harness/scripts/bucky-vpn-process-integration.py", "--use-base-image", "--parallel-instances", "2"]
