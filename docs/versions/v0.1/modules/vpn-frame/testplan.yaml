schema_version: 1
version: v0.1
module: vpn-frame
defaults:
  workdir: .
  timeout_sec: 1800
  env: {}
levels:
  unit:
    mode: enabled
    summary: Run vpn-frame crate tests for the structured PN server info protocol contract.
    test_targets:
      - vpn-frame
    preconditions:
      tools:
        - cargo
      env: []
      services: []
      notes:
        - Covers CHG-pn-server-info-contract protocol value behavior without endpoint-string compatibility.
        - Covers CHG-node-id-base36-contract canonical NodeId text helpers.
        - Covers CHG-pn-server-reported-name-contract optional reported-name normalization and fallback.
    steps:
      - id: vpn-frame-unit
        name: Run vpn-frame crate tests
        change_ids: ["CHG-pn-server-info-contract", "CHG-node-id-base36-contract", "CHG-pn-server-reported-name-contract"]
        run: ["python3", "./harness/scripts/test-run.py", "vpn-frame", "unit"]
  dv:
    mode: enabled
    summary: Build vpn-frame crate with the structured PN server protocol and store-facing field.
    test_targets:
      - vpn-frame
    preconditions:
      tools:
        - cargo
      env: []
      services: []
      notes:
        - Storage compatibility with old endpoint-string PN server data is intentionally not covered.
    steps:
      - id: vpn-frame-dv
        name: Build vpn-frame crate
        change_ids: ["CHG-pn-server-info-contract", "CHG-node-id-base36-contract", "CHG-pn-server-reported-name-contract"]
        run: ["python3", "./harness/scripts/test-run.py", "vpn-frame", "dv"]
  integration:
    mode: enabled
    summary: Run workspace tests for client/server consumer compatibility with structured PN server data.
    test_targets:
      - vpn-frame
      - vpn-client
      - vpn-server
    preconditions:
      tools:
        - cargo
      env: []
      services: []
      notes:
        - Covers direct consumers of NodeNetwork.pn_server, ReportPnTrafficStatsReq.pn_server, optional PN server name, and NodeId canonical text.
    steps:
      - id: vpn-frame-integration
        name: Run workspace tests
        change_ids: ["CHG-pn-server-info-contract", "CHG-node-id-base36-contract", "CHG-pn-server-reported-name-contract"]
        run: ["python3", "./harness/scripts/test-run.py", "vpn-frame", "integration"]
