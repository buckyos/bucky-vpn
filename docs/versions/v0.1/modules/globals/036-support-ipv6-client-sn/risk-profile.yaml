schema_version: 1
task_manifest: task.yaml
change_ids: ["CHG-client-ipv6-listen", "CHG-server-ipv6-listen", "CHG-client-sn-ipv6-endpoint", "CHG-sn-comms-ipv6-surfaces", "CHG-ipv6-capability-boundaries"]
source_bindings:
  proposal: proposal.md
  design_source:
risks:
  contract:
    applies: true
    evidence:
      - vpn-client/src/main.rs
      - vpn-client/src/cli.rs
      - vpn-client/src/p2p_vpn.rs
      - vpn-server/src/server_config.rs
      - vpn-server/src/main.rs
      - vpn-server/config/config.example.yaml
    required_checks:
      - "Client listen family configuration accepts exactly the documented values, defaults to the current IPv4 behavior when omitted, and rejects invalid values with a message naming the key."
      - "Server listen address configuration accepts IPv4 literal, IPv6 literal, IPv6 wildcard, and the documented multi-address form; at most one wildcard per family is allowed and duplicates or malformed entries fail startup."
      - "SN identity endpoints, service endpoints, PN primary endpoint, and HTTP API bind address are all derived from the same validated listen set with no leftover IPv4-only parsing."
      - "Existing configurations that set only the current IPv4 values keep their previous endpoints, ordering, and startup behavior."
  data:
    applies: false
    evidence: "No database schema, persisted application data, migration, or wire-encoding change is introduced; the work only changes how listen addresses and families are configured and bound."
    required_checks: []
  security:
    applies: true
    evidence:
      - vpn-server/src/server_config.rs
      - vpn-client/src/main.rs
    required_checks:
      - "An explicitly configured IPv6 wildcard listener must not silently absorb IPv4 traffic through v4-mapped addresses, so IPv4-only policy checks and observed-address classification cannot be bypassed."
      - "Default configuration keeps the current exposure: no new listener family is opened unless the operator configures it."
      - "Invalid or conflicting listen sets fail closed at startup instead of binding a partially configured surface."
  runtime:
    applies: true
    evidence:
      - vpn-client/src/main.rs
      - vpn-client/src/p2p_vpn.rs
      - vpn-server/src/main.rs
      - vpn-server/src/server_config.rs
    required_checks:
      - "Binding an IPv4 wildcard and an IPv6 wildcard on the same port must succeed on platforms where the default IPv6 socket option would otherwise cause EADDRINUSE, and must not change behavior when only one family is configured."
      - "Listen failures surface as diagnosable startup errors; a client bind failure must not become an untraceable panic."
      - "Client SN endpoint selection must handle an IPv6 literal, a domain resolving to both families, and a domain resolving only to one family without regressing the existing QUIC-before-TCP ordering."
      - "IPv6-connected clients keep the already accepted capability boundary: NAT probe directives fail closed rather than producing unusable IPv4 reflector endpoints."
  build:
    applies: true
    evidence:
      - Cargo.toml
      - Cargo.lock
      - vpn-client/Cargo.toml
      - vpn-server/Cargo.toml
    required_checks:
      - "Affected workspaces compile with the configured p2p-frame dependency state, and any upstream p2p-frame change required for IPv6 wildcard coexistence is recorded with its repository, commit, and dependency rev mapping."
      - "No new third-party dependency is introduced by this work."
  ui:
    applies: false
    evidence: "No Flutter UI, web asset, or user-visible interaction behavior is changed; the work is limited to process listen configuration and SN connectivity."
    required_checks: []
  harness:
    applies: false
    evidence: "Harness rules, scripts, and checkers are consumed as-is; the task records its workflow evidence without modifying repository governance."
    required_checks: []
