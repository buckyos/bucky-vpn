defaults:
  workdir: .
  timeout_sec: 600
  env: {}
# Level contracts per harness/rules/test-design-rules.md: unit = every changed-code branch,
# dv = module lifecycle + main + failure workflows, integration = per-interface success + failure semantics.
# One record per case or gap. Multi-value tags replace separate change/type/design/level tables.
# Scalars are single-line; list fields use inline quoted strings. Record every changed branch,
# workflow, and consumed interface at the required depth; tags alone do not prove coverage.
# Include all case types per change and all design element types overall, using task-specific
# not-applicable/gap records where needed. See test-design-rules.md for the full contract.
coverage:
  - id: VAL-example
    change_ids: ["CHG-example"]
    design_source: "design.md File-Level Interfaces / ExampleStore.load"
    target: "ExampleStore.load: missing key branch"
    case_types: ["normal", "boundary"]
    element_types: ["parameter-domain"]
    level: unit
    status: covered
    test: "tests/unit/example-module/test_store.py::test_missing_key"
    step_id: example-unit
    assertion: "missing key returns None without creating a record"
# Non-covered records use status: gap/manual/disabled/not-applicable and a concrete reason.
# Manual/disabled records may inherit the matching level's reason instead of repeating it.
# Add DV/integration cases or explicit gaps, and the remaining applicable types/elements.
levels:
  unit:
    mode: enabled
    summary: core logic and submodule unit tests
    test_targets:
      - tests/unit/example-module
    preconditions:
      tools: []
      env: []
      services: []
      notes: []
    steps:
      - id: example-unit
        name: run unit tests
        change_ids: ["CHG-example"]
        run: ["<tool>", "<args>"]

  dv:
    mode: enabled
    summary: single-module runnable verification
    test_targets:
      - tests/dv/example-module
    preconditions:
      tools: []
      env: []
      services: []
      notes: []
    steps:
      - id: example-dv
        name: run dv tests
        change_ids: ["CHG-example"]
        run: ["<tool>", "<args>"]

  integration:
    mode: enabled
    summary: neighbor-module integration verification
    test_targets:
      - tests/integration/example-module
    preconditions:
      tools: []
      env: []
      services: []
      notes: []
    steps:
      - id: example-integration
        name: run integration tests
        change_ids: ["CHG-example"]
        run: ["<tool>", "<args>"]
