# Mechanical quality gates for this repository.
#
# harness/scripts/quality-check.py runs every declared gate and fails when any
# gate fails. Generated task flows and acceptance do not run these gates
# automatically; execute them only on explicit user request or when a matching
# highest-priority custom rule requires them. Run artifacts live under the
# git-ignored .harness/test-results/quality-runs/ directory.
#
# Declare the repository's build/lint/typecheck commands here. Gates must be
# non-interactive, deterministic, and return a meaningful exit code.
#
# An explicitly empty list is a versioned, reviewable decision and requires a
# concrete non-placeholder empty_reason. A missing file or reason fails closed.
schema_version: 1
gates: []
empty_reason: Repository-wide build and lint gates are not declared; Rust and Flutter validation remains scoped through the canonical module test suites.
# Example (Rust):
# gates:
#   - id: build
#     run: ["cargo", "build", "--workspace"]
#   - id: clippy
#     run: ["cargo", "clippy", "--workspace", "--", "-D", "warnings"]
# Example (Python):
# gates:
#   - id: lint
#     run: ["uv", "run", "--active", "ruff", "check", "."]
#   - id: typecheck
#     run: ["uv", "run", "--active", "mypy", "."]
