[package]
name = "vpn-client"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.43.0", features = ["full"]}
async-std = { version = "1.13.1", features = ["tokio1"]}
async-trait = "0.1.85"
p2p-frame = {git = "https://github.com/buckyos/bucky-p2p.git", features = ["x509"]}
vpn-frame = { path = "../vpn-frame"}
sfo-log = "0.1.3"
clap = "4.5.31"
rustls = { version = "0.23.20", default-features = false, features = ["ring", "std"] }
sfo-http = { path = "../../sfo-http", version = "0.6.5", features = ["tide", "openapi"] }
sfo-result = { version = "0.2.6" }
serde = "1.0.218"
serde_json = "1.0.140"
log = "0.4.26"
dirs = "6.0.0"
toml = "0.8.20"
