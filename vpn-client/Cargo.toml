[package]
name = "bucky-vpn"
version = "1.0.0"
edition = "2024"
build = "build.rs"

[package.metadata.winres]
FileVersion = "1.0.0"
ProductVersion = "1.0.0"
ProductName = "BuckyVPN"
InternalName = "BuckyVPN"

[dependencies]
tokio = { version = "1.43.0", features = ["full"]}
async-std = { version = "1.13.1", features = ["tokio1"]}
async-trait = "0.1.85"
p2p-frame = {git = "https://github.com/buckyos/bucky-p2p.git", features = ["x509"]}
#p2p-frame = { path = "../../p2p/p2p-frame", features = ["x509"]}
vpn-frame = { path = "../vpn-frame"}
sfo-log = "0.1.7"
clap = "4.5.31"
rustls = { version = "0.23.20", default-features = false, features = ["ring", "std"] }
sfo-http = { version = "0.6.5", features = ["tide", "openapi"] }
sfo-result = { version = "0.2.6" }
serde = "1.0.218"
serde_json = "1.0.140"
log = "0.4.26"
dirs = "6.0.0"
toml = "0.8.20"
base58 = "0.2.0"
config = "0.15.8"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.0"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.0"
